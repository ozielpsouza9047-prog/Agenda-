<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c2e"/>
      <stop offset="50%" stop-color="#0a0515"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Outer Neon Glow Shield -->
  <path d="M256 64 L396 116 C396 248 336 376 256 448 C176 376 116 248 116 116 Z"
        fill="none" stroke="#c084fc" stroke-width="8" filter="url(#neonGlow)" opacity="0.4"/>

  <!-- Main Shield Shape -->
  <path d="M256 76 L384 124 C384 242 330 358 256 424 C182 358 128 242 128 124 Z"
        fill="url(#shieldGrad)"/>

  <!-- Inner highlight -->
  <path d="M256 94 L366 136 C366 238 318 338 256 398 C194 338 146 238 146 136 Z"
        fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Zero / Checkmark Hybrid in White/Glow -->
  <path d="M256 160 C212 160 176 196 176 256 C176 316 212 352 256 352 C300 352 336 316 336 256 C336 196 300 160 256 160 Z M256 196 C278 196 296 222 296 256 C296 290 278 316 256 316 C234 316 216 290 216 256 C216 222 234 196 256 196 Z"
        fill="#ffffff"/>

  <!-- Slanted Zero Zero Line to evoke "Dívida Zero" / Quitação -->
  <line x1="208" y1="304" x2="304" y2="208" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Sparkle stars top right -->
  <circle cx="376" cy="100" r="12" fill="#f3e8ff" filter="url(#neonGlow)"/>
  <circle cx="396" cy="140" r="6" fill="#c084fc"/>
</svg>
